<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Heat Index Dashboard</title>
 
<style>
  body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}
 
.card{
text-align:center;
width:90%;
max-width:1000px;
}
 
.location{
font-size:42px;
margin-bottom:25px;
}
 
.banner{
font-size:42px;
font-weight:bold;
padding:20px;
border-radius:12px;
margin-bottom:40px;
}
 
.label{
font-size:26px;
margin-bottom:10px;
}
 
.heat{
font-size:120px;
font-weight:bold;
margin-bottom:40px;
}
 
.temp{
font-size:100px;
font-weight:bold;
margin-bottom:40px;
color:#38bdf8;
}
 
.updated{
margin-top:20px;
font-size:18px;
opacity:.8;
}
 
.safe{
background:#16a34a;
}
 
.caution{
background:#facc15;
color:black;
}
 
.extreme-caution{
background:#f97316;
}
 
.danger{
background:#dc2626;
}
 
.extreme-danger{
background:#7e22ce;
}
</style>
</head>
 
<body>
 <div class="card">
 
<div class="location">
Cincinnati Division<br>
Lebanon, OH
</div>
 
<div id="heatLevel" class="banner">
Loading...
</div>
 
<div class="label">
Current Heat Index
</div>
 
<div id="heat" class="heat">
--
</div>
 
<div class="label">
Current Temperature
</div>
 
<div id="temp" class="temp">
--
</div>
 
<div id="updated" class="updated"></div>
 
</div>
<script>
  const LAT = 39.4353;
  const LON = -84.2027;
 
function cToF(celsius){
return Math.round((celsius * 9/5) + 32);
}
 
async function loadWeather(){
 
try{
 
const pointResponse =
await fetch(
`https://api.weather.gov/points/${LAT},${LON}`
);
`` 
const pointData =
await pointResponse.json();
 
const gridUrl =
pointData.properties.forecastGridData;
 
const gridResponse =
await fetch(gridUrl);
 
const gridData =
await gridResponse.json();
 
const heatValues =
gridData.properties.heatIndex.values;
 
const tempValues =
gridData.properties.temperature.values;
 
const heatReading =
heatValues.find(x => x.value !== null);
 
const tempReading =
tempValues.find(x => x.value !== null);
 
if(!tempReading){
return;
}
 
const temperature =
cToF(tempReading.value);
 
document.getElementById("temp")
.innerText = `${temperature}°F`;
 
let heatIndex = null;
 
if(!heatReading){
 
document.getElementById("heat")
.innerText = "N/A";
 
}else{
 
heatIndex = cToF(heatReading.value);
 
document.getElementById("heat")
.innerText = `${heatIndex}°F`;
}
 
document.getElementById("heat")
.innerText = `${heatIndex}°F`;
 
document.getElementById("temp")
.innerText = `${temperature}°F`;
 
const banner =
document.getElementById("heatLevel");
 
banner.className = "banner";
 
let level = "";
 
if(heatIndex < 80){
 
level = "SAFE";
banner.classList.add("safe");
 
}else if(heatIndex < 90){
 
level = "CAUTION";
banner.classList.add("caution");
 
}else if(heatIndex < 103){
 
level = "EXTREME CAUTION";
banner.classList.add("extreme-caution");
 
}else if(heatIndex < 125){
 
level = "DANGER";
banner.classList.add("danger");
 
}else{
 
level = "EXTREME DANGER";
banner.classList.add("extreme-danger");
}
 
banner.innerText = level;
 
document.getElementById("updated")
.innerText =
"Last Updated: " +
new Date().toLocaleString();
 
}
catch(error){
 
console.error(error);
 
document.getElementById("heat")
.innerText = "ERROR";
 
document.getElementById("temp")
.innerText = "ERROR";
}
}
 
loadWeather();
 
setInterval(loadWeather, 300000);
</script>
</body>
</html>
