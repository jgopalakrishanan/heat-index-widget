<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Heat Index Dashboard</title>
 
<style>
 
body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
width:100vw;
height:100vh;
overflow:hidden;
}
 
.card{
height:100%;
width:100%;
box-sizing:border-box;
padding:15px;
display:grid;
grid-template-rows:
auto
auto
1fr
1fr
1fr
auto;
gap:10px;
text-align:center;
}
 
.location{
font-size:clamp(20px,4vw,40px);
font-weight:bold;
}
 
.banner{
font-size:clamp(24px,5vw,48px);
font-weight:bold;
padding:12px;
border-radius:10px;
}
 
.metric-label{
font-size:clamp(14px,2vw,18px);
text-transform:uppercase;
opacity:0.85;
}
 
.heat{
font-size:clamp(50px,8vw,100px);
font-weight:bold;
color:#facc15;
}
 
.temp{
font-size:clamp(50px,8vw,100px);
font-weight:bold;
color:#38bdf8;
}
 
.humidity{
font-size:clamp(50px,8vw,100px);
font-weight:bold;
color:#22c55e;
}
 
.updated{
font-size:clamp(12px,1.5vw,18px);
opacity:0.75;
}
 
.safe{
background:#22c55e;
}
 
.caution{
background:#facc15;
color:black;
}
 
.extreme-caution{
background:#f97316;
}
 
.danger{
background:#dc2626;
}
 
.extreme-danger{
background:#7e22ce;
}
 
</style>
</head>
 
<body>
 
<div class="card">
 
<div class="location">
Heat Index Dashboard<br>
Lebanon, OH
</div>
 
<div id="heatLevel" class="banner">
Loading...
</div>
 
<div>
<div class="metric-label">Feels Like</div> <!--Renamed from Heat Index to Feels Like -->
<div id="heat" class="heat">--</div>
</div>
 
<div>
<div class="metric-label">Temperature</div>
<div id="temp" class="temp">--</div>
</div>
 
<div>
<div class="metric-label">Humidity</div>
<div id="humidity" class="humidity">--</div>
</div>
 
<div id="updated" class="updated">
Loading...
</div>
 
</div>
 
<script>
//Reduce API calls by hardcoding weather station derived from weather.gov for LAT and LON
// const LAT = 39.3933;
// const LON = -84.2285;
const STATION = "https://api.weather.gov/stations/KI68";
 
function cToF(celsius){
return Math.round((celsius * 9 / 5) + 32);
}
function calculateHeatIndex(tempF, humidity) {
 
// Heat index isn't really used below 80°F, Added Function to compute Feels Like locally when no heat index available from API
if (tempF < 80) {
return tempF;
}
 
const HI =
-42.379 +
2.04901523 * tempF +
10.14333127 * humidity -
0.22475541 * tempF * humidity -
0.00683783 * tempF * tempF -
0.05481717 * humidity * humidity +
0.00122874 * tempF * tempF * humidity +
0.00085282 * tempF * humidity * humidity -
0.00000199 * tempF * tempF * humidity * humidity;
 
return Math.round(HI);
}
 
async function loadWeather(){
 
try{
 
// Get latest observation
const observationResponse =
await fetch(
`${STATION}/observations/latest`
);
 
const observationData =
await observationResponse.json();
 
const props =
observationData.properties;
 
// Temperature, Added Color coding to show Temperate Trend Color
if(props.temperature.value !== null){
 
const temperature =
cToF(props.temperature.value);
 
const tempElement =
document.getElementById("temp");
 
tempElement.innerText =
`${temperature}°F`;
 
// Change color based on temperature
if (temperature >= 95) {
tempElement.style.color = "#ef4444"; // Red
}
else if (temperature >= 85) {
tempElement.style.color = "#f97316"; // Orange
}
else if (temperature >= 75) {
tempElement.style.color = "#facc15"; // Yellow
}
else {
tempElement.style.color = "#38bdf8"; // Blue
}
}
 
// Relative Humidity
if(props.relativeHumidity.value !== null){
 
document.getElementById("humidity")
.innerText =
`${Math.round(
props.relativeHumidity.value
)}%`;
}
 
// "Feels Like" Added Function to compute Feels Like locally when no heat index available from API
// Added color coding for HeatIndex based on OSHA/NIOSH standards
let heatIndex = null;
 
if (
props.temperature?.value !== null &&
props.relativeHumidity?.value !== null
) {
 
const tempF =
cToF(props.temperature.value);
 
heatIndex = calculateHeatIndex(
tempF,
props.relativeHumidity.value
);
 
const heatElement = document.getElementById("heat")
heatElement.innerText =
`${heatIndex}°F`;
if (heatIndex < 80) {
heatElement.style.color = "#22c55e";
}
else if (heatIndex <= 90) {
heatElement.style.color = "#facc15";
}
else if (heatIndex <= 103) {
heatElement.style.color = "#f97316";
}
else if (heatIndex <= 115) {
heatElement.style.color = "#dc2626";
}
else {
heatElement.style.color = "#7e22ce";
}
}
else {
 
document.getElementById("heat")
.innerText =
"N/A";
}
 
const banner =
document.getElementById("heatLevel");
 
banner.className =
"banner";
 
if(heatIndex === null){
 
banner.innerText =
"SAFE";
 
}
else if(heatIndex < 80){
 
banner.innerText =
"SAFE";
 
banner.classList.add(
"safe"
);
 
}
else if(heatIndex < 90){
 
banner.innerText =
"CAUTION";
 
banner.classList.add(
"caution"
);
 
}
else if(heatIndex < 103){
 
banner.innerText =
"HIGH";
 
banner.classList.add(
"extreme-caution"
);
 
}
else if(heatIndex < 115){
 
banner.innerText =
"VERY HIGH";
 
banner.classList.add(
"danger"
);
 
}
else{
 
banner.innerText =
"EXTREME";
 
banner.classList.add(
"extreme-danger"
);
}
 
document.getElementById("updated")
.innerText =
"Updated " +
new Date().toLocaleTimeString(
[],
{
hour: "numeric",
minute: "2-digit"
}
);
 
}
catch(error){
 
console.error(error);
 
document.getElementById("heat")
.innerText = "ERROR";
 
document.getElementById("temp")
.innerText = "ERROR";
 
document.getElementById("humidity")
.innerText = "ERROR";
 
document.getElementById("heatLevel")
.innerText =
"DATA ERROR";
}
}
 
loadWeather();
 
setInterval(loadWeather, 300000);
 
</script>
 
</body>
</html>
